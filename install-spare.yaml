apiVersion: v1
data:
  check.sh: |
    #!/bin/sh

    USAGE=$(du -sm /kspeeder-data | cut -f1)
    MAX_SIZE=4096  # 4GB = 4096MB

    if [ "$USAGE" -gt "$MAX_SIZE" ]; then
        echo "Data directory usage ${USAGE}MB exceeds ${MAX_SIZE}MB"
        exit 1
    fi

    exit 0
  kspeeder.yml: |
    mirrors:
      - url: "https://docker.1ms.run"
      - url: "https://docker.1panel.live"
      - url: "https://docker.367231.xyz"
      - url: "https://docker.amingg.com"
      - url: "https://docker.m.daocloud.io"
      - url: "https://docker.m.ixdev.cn"
      - url: "https://dockerproxy.net"
      - url: "https://hub.1panel.dev"
      - url: "https://image.cloudlayer.icu"
kind: ConfigMap
metadata:
  labels:
    app: kspeeder
    env: spare
  name: kspeeder-config-45kddmfb7h
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: kspeeder
    env: spare
  name: kspeeder-service
spec:
  ports:
  - name: http
    port: 5003
    targetPort: 5003
  selector:
    app: kspeeder
    env: spare
    svc: server
  type: ClusterIP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app: kspeeder
    env: spare
  name: kspeeder-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kspeeder
      env: spare
      svc: server
  template:
    metadata:
      labels:
        app: kspeeder
        env: spare
        svc: server
    spec:
      containers:
      - env:
        - name: TZ
          value: Asia/Shanghai
        image: registry.kspeeder.com/linkease/kspeeder:0.7.14
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - /healthcheck/check.sh
          failureThreshold: 3
          initialDelaySeconds: 1800
          periodSeconds: 189
          timeoutSeconds: 10
        name: kspeeder
        ports:
        - containerPort: 5443
          hostPort: 5443
          protocol: TCP
        - containerPort: 5003
          hostPort: 5003
          protocol: TCP
        volumeMounts:
        - mountPath: /healthcheck/check.sh
          name: config
          readOnly: true
          subPath: check.sh
        - mountPath: /kspeeder-config/kspeeder.yml
          name: config
          readOnly: true
          subPath: kspeeder.yml
        - mountPath: /kspeeder-data
          name: data
          readOnly: false
      hostNetwork: true
      volumes:
      - configMap:
          defaultMode: 493
          name: kspeeder-config-45kddmfb7h
        name: config
      - emptyDir: {}
        name: data
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    cert-manager.io/cluster-issuer: intermediate-ca-cluster-issuer
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
  labels:
    env: spare
  name: kspeeder-ingress
spec:
  rules:
  - host: kspeeder.spare.an
    http:
      paths:
      - backend:
          service:
            name: kspeeder-service
            port:
              name: http
        path: /
        pathType: Prefix
  tls:
  - hosts:
    - kspeeder.spare.an
    secretName: kspeeder-server-tls
