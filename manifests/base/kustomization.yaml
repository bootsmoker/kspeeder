apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

configMapGenerator:
- name: config
  files:
  - config/check.sh
  - config/kspeeder.yml

images:
- name: registry.kspeeder.com/linkease/kspeeder
  newTag: 0.8.4

labels:
- includeSelectors: true
  includeTemplates: true
  pairs:
    app: kspeeder

replicas:
- name: server
  count: 1

resources:
- service.yaml
- statefulset.yaml
